name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Verificar em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Configurar Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restaurar cache do Rust
        uses: Swatinem/rust-cache@v2

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências da interface
        run: npm ci

      - name: Verificar formatação Rust
        run: cargo fmt --all -- --check

      - name: Executar Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Executar testes Rust
        run: cargo test --workspace

      - name: Compilar interface
        run: npm run build
