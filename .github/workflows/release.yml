name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Gerar instaladores em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb,rpm
          - os: windows-latest
            bundles: nsis,msi

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Configurar Rust estável
        uses: dtolnay/rust-toolchain@stable

      - name: Restaurar cache do Rust
        uses: Swatinem/rust-cache@v2

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências da interface
        run: npm ci

      - name: Criar release provisória e anexar instaladores
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Olhorganizer v__VERSION__
          releaseBody: Veja os instaladores disponíveis abaixo.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
