[package]
name = "monitor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "olhorganizer-cli"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
motor = { path = "../motor" }
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", optional = true }
walkdir = "2.5.0"

[features]
default = ["cli"]
# Dependencies only the command-line tool needs; the Tauri app turns this off.
cli = ["dep:anyhow", "dep:tracing-subscriber", "tokio/signal"]

[dev-dependencies]
tempfile = "3.27.0"
